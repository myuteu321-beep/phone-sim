<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b0e">
  <title>가상 아이폰</title>
  <link rel="stylesheet" href="css/phone.css">
  <link rel="stylesheet" href="css/lockscreen.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/apps.css">
  <link rel="stylesheet" href="css/x.css">
  <link rel="stylesheet" href="css/instagram.css">
  <link rel="stylesheet" href="css/kakao.css">
  <link rel="stylesheet" href="css/youtube.css">
  <link rel="stylesheet" href="css/photos.css">
  <link rel="stylesheet" href="css/news.css">
</head>
<body>

  <div id="stage">
    <div id="phone" data-state="locked">

      <!-- 폰 옆면 버튼 (전원 버튼을 누르면 화면이 잠겨요) -->
      <span class="side-btn btn-silent"></span>
      <span class="side-btn btn-vol-up"></span>
      <span class="side-btn btn-vol-down"></span>
      <span class="side-btn btn-power" title="화면 잠그기"></span>

      <!-- 실제 화면 -->
      <div id="screen">

        <!-- 홈 화면 배경 -->
        <div id="wallpaper"></div>

        <!-- 홈 화면 / 앱이 들어갈 자리 -->
        <div id="content">
          <div id="home">
            <div id="home-pages">
              <div id="home-track">
                <div class="home-page"></div>
                <div class="home-page"></div>
              </div>
            </div>
            <button id="home-search" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>검색
            </button>
            <div id="home-dots"><i class="on"></i><i></i></div>
            <div id="dock"></div>
          </div>
          <!-- 앱이 열리면 여기에 들어가요 -->
          <div id="app-layer"></div>
          <!-- (잠금화면 코드가 찾는 버튼이라 지우면 안 돼요) -->
          <button id="relock-btn" type="button" hidden></button>
        </div>

        <!-- ================= 잠금화면 ================= -->
        <div id="lockscreen">
          <div id="lock-wallpaper"></div>

          <!-- 잠금화면 기본 (시간, 알림, 버튼) -->
          <div id="lock-main">
            <svg id="lock-icon" width="22" height="28" viewBox="0 0 22 28" fill="#fff">
              <path d="M11 0C7.1 0 4.5 2.6 4.5 6.4V10H3.2C1.4 10 0 11.4 0 13.2v11.6C0 26.6 1.4 28 3.2 28h15.6c1.8 0 3.2-1.4 3.2-3.2V13.2c0-1.8-1.4-3.2-3.2-3.2h-1.3V6.4C17.5 2.6 14.9 0 11 0zm0 3c2.2 0 3.5 1.4 3.5 3.4V10h-7V6.4C7.5 4.4 8.8 3 11 3z"/>
            </svg>
            <div id="lock-date">10월 24일 토요일</div>
            <div id="lock-time">8:00</div>

            <!-- 알림 목록 (data/notifications.js 내용이 여기에 들어가요) -->
            <div id="notif-list"></div>

            <button id="btn-flash" class="round-btn btn-left" type="button" aria-label="손전등">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 2h8v4l-2 3v13a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V9L8 6z"/>
                <path d="M12 12v3"/>
              </svg>
            </button>
            <button id="btn-camera" class="round-btn btn-right" type="button" aria-label="카메라">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </button>

            <div id="lock-hint">
              <svg width="22" height="10" viewBox="0 0 22 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l9-6 9 6"/></svg>
              <span>위로 쓸어올려 잠금 해제</span>
            </div>
          </div>

          <!-- 비밀번호 입력 화면 -->
          <div id="passcode">
            <div id="pc-title">암호 입력</div>
            <div id="pc-dots"></div>
            <div id="pc-pad"></div>
            <div id="pc-foot">
              <button id="pc-emergency" class="pc-link" type="button">긴급 상황</button>
              <button id="pc-cancel" class="pc-link" type="button">취소</button>
            </div>
          </div>
        </div>
        <!-- ============================================ -->

        <!-- 안내 메시지 (잠깐 떴다 사라져요) -->
        <div id="toast"></div>

        <!-- 상단 상태 표시줄 (항상 맨 위에 유지) -->
        <div id="statusbar">
          <div class="sb-left">
            <span id="sb-time">9:41</span>
            <span id="sb-carrier-lock" class="sb-carrier-lock">KT</span>
          </div>
          <div class="island"></div>
          <div class="sb-right">
            <span id="sb-carrier" class="sb-carrier">KT</span>
            <!-- 신호 -->
            <svg class="sb-icon" width="19" height="13" viewBox="0 0 18 12" fill="#fff">
              <rect x="0" y="8" width="3" height="4" rx="1"/>
              <rect x="5" y="5.5" width="3" height="6.5" rx="1"/>
              <rect x="10" y="3" width="3" height="9" rx="1"/>
              <rect x="15" y="0" width="3" height="12" rx="1"/>
            </svg>
            <!-- 와이파이 -->
            <svg class="sb-icon" width="18" height="13" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round">
              <path d="M1.5 4.2a10 10 0 0 1 14 0"/>
              <path d="M4 7a6.3 6.3 0 0 1 9 0"/>
              <circle cx="8.5" cy="10" r="1.4" fill="#fff" stroke="none"/>
            </svg>
            <!-- 배터리 -->
            <span class="battery"><i id="battery-fill"></i></span>
          </div>
        </div>

        <!-- 하단 홈바 -->
        <div id="homebar"><span></span></div>

      </div>
    </div>
  </div>

  <!-- 설정/데이터 파일 먼저, 그다음 동작 파일 (순서를 바꾸면 안 돼요) -->
  <script src="data/config.js"></script>
  <script src="data/notifications.js"></script>
  <script src="data/apps.js"></script>
  <script src="data/x-data.js"></script>
  <script src="data/instagram-data.js"></script>
  <script src="data/kakao-data.js"></script>
  <script src="data/photos-data.js"></script>
  <script src="data/news-data.js"></script>
  <script src="data/links.js"></script>
  <script src="js/core/phone.js"></script>
  <script src="js/core/apps.js"></script>
  <script src="js/core/home.js"></script>
  <script src="js/apps/x.js"></script>
  <script src="js/apps/instagram.js"></script>
  <script src="js/apps/kakao.js"></script>
  <script src="js/apps/youtube.js"></script>
  <script src="js/apps/photos.js"></script>
  <script src="js/apps/news.js"></script>
  <script src="js/apps/links.js"></script>
  <script src="js/core/lockscreen.js"></script>
</body>
</html>
